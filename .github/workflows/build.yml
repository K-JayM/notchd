name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build
    runs-on: macos-15
    env:
      # Optional (scripts/make-signing-cert.sh sets them). Without them the app is signed ad hoc.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A release tag must match the VERSION file.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match VERSION ($VERSION)"
            exit 1
          fi

      - name: Cache media helper
        uses: actions/cache@v4
        with:
          path: .build/mediaremote
          key: mediaremote-${{ hashFiles('scripts/build-mediaremote.sh') }}

      - name: Unit tests
        run: ./scripts/test.sh

      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          # -v hides untrusted self-signed certs, so list them all and take the first one.
          IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN" | grep -m1 -o '"[^"]*"' | tr -d '"')
          echo "Signing as: $IDENTITY"
          echo "NOTCHD_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build universal app
        env:
          UNIVERSAL: "1"
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/bundle.sh

      - name: Zip
        # ditto keeps the framework's symlinks and the code signature intact.
        run: ditto -c -k --keepParent build/Notchd.app "build/Notchd-${{ steps.version.outputs.version }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notchd-${{ steps.version.outputs.version }}-build${{ github.run_number }}
          path: build/Notchd-${{ steps.version.outputs.version }}.zip
          compression-level: 0  # already zipped
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Notchd-${{ needs.build.outputs.version }}.zip
          generate_release_notes: true
